    <text x="482" y="284" fill="#E2E8F0" font-size="22" font-family="Inter,Segoe UI,sans-serif" font-weight="700">Matching IA</text>

    <rect x="484" y="314" width="244" height="24" rx="12" fill="#0B1220" fill-opacity="0.5"/>
    <rect x="484" y="314" width="214" height="24" rx="12" fill="#22C55E"/>
    <text x="734" y="332" text-anchor="end" fill="#F8FAFC" font-size="16" font-family="Inter,Segoe UI,sans-serif">87%</text>

