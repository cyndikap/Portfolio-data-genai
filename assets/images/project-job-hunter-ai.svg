<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Illustration Job Hunter AI</title>
  <desc id="desc">Tableau de bord IA de veille emploi avec matching score, alertes email et opportunites Data IA.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#0B3B6F"/>
      <stop offset="100%" stop-color="#EA3E2C"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <circle cx="1030" cy="130" r="180" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="140" cy="540" r="150" fill="#FFFFFF" opacity="0.05"/>

  <g filter="url(#soft)">
    <rect x="92" y="84" width="1016" height="462" rx="28" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.24"/>
  </g>

  <g opacity="0.95">
    <rect x="130" y="130" width="440" height="92" rx="14" fill="#FFFFFF" fill-opacity="0.16"/>
    <rect x="150" y="153" width="250" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.74"/>
    <rect x="150" y="177" width="168" height="12" rx="6" fill="#BFDBFE" fill-opacity="0.95"/>
