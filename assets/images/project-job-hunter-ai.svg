    <text x="182" y="362" fill="#F8FAFC" font-size="17" font-family="Inter,Segoe UI,sans-serif">Welcome to the Jungle</text>

    <circle cx="166" cy="390" r="6" fill="#34D399"/>
    <text x="182" y="396" fill="#F8FAFC" font-size="17" font-family="Inter,Segoe UI,sans-serif">Indeed</text>

