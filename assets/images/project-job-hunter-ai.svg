    <rect x="484" y="354" width="182" height="24" rx="12" fill="#38BDF8"/>
    <text x="734" y="372" text-anchor="end" fill="#F8FAFC" font-size="16" font-family="Inter,Segoe UI,sans-serif">74%</text>

