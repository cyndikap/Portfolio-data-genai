    <text x="734" y="412" text-anchor="end" fill="#F8FAFC" font-size="16" font-family="Inter,Segoe UI,sans-serif">63%</text>

    <text x="484" y="455" fill="#BFDBFE" font-size="16" font-family="Inter,Segoe UI,sans-serif">Scoring automatique des offres Data &amp; IA</text>
