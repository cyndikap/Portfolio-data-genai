    <text x="828" y="362" fill="#C7D2FE" font-size="14" font-family="Inter,Segoe UI,sans-serif">Data Engineer GenAI - Paris</text>

    <rect x="810" y="392" width="230" height="66" rx="12" fill="#FFFFFF" fill-opacity="0.16"/>
    <text x="828" y="420" fill="#F8FAFC" font-size="16" font-family="Inter,Segoe UI,sans-serif" font-weight="600">Email envoye</text>
    <text x="828" y="442" fill="#C7D2FE" font-size="14" font-family="Inter,Segoe UI,sans-serif">Score 87% - candidature prioritaire</text>
